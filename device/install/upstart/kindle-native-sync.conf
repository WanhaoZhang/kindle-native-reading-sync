description "Passive native Kindle reading collector"
start on started lab126_gui
stop on stopping lab126_gui
respawn
respawn limit 3 60
nice 15
pre-start script
    test ! -e /var/local/kindle-native-sync/disabled || exit 1
    . /var/local/kindle-native-sync/install/common.sh
    require_device
end script
exec /var/local/kindle-native-sync/bin/ksync-collector --root /var/local/kindle-native-sync
